name: Production CI/CD Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  # Deploy kreće samo ako prođu svi testovi, typecheck i build asseta.
  test:
    runs-on: ubuntu-latest

    # MariaDB iste verzije kao produkcija; šemu iz sql/ fajlova pravi Tests\Baza\PripremaBaze.
    # Port 13306 i lozinka „test” su podrazumevane vrednosti iz phpunit.xml.
    services:
      baza:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 13306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # bcmath: obračun poreza (BcMath\Number); pdo_mysql: Laravel; mysqli: učitavanje sql/ fajlova u test bazu.
          extensions: mbstring, xml, ctype, iconv, intl, bcmath, fileinfo, pdo_mysql, mysqli
          coverage: none
          tools: composer

      - name: Install Composer Dependencies (sa dev paketima za PHPUnit)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: TypeScript provera
        run: npm run typecheck

      # public/build nije u git-u, a stranice koje testovi prikazuju učitavaju Vite manifest.
      - name: Build asseta (Vite)
        run: npm run build

      - name: Testovi (PHPUnit)
        run: php artisan test

      - name: Send Failure Email via Brevo SMTP
        if: failure()
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [TESTOVI] Deploy zaustavljen - brokerporez.net"
          body: "Testovi, TypeScript provera ili build nisu prošli, pa deploy na server nije pokrenut. Produkcija radi na prethodnoj verziji. Proverite GitHub Actions logove."
          to: "makimitrovic07@gmail.com"
          from: "BrokerPorez CI/CD <no-reply@brokerporez.net>"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          tools: composer

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/broker_porez
            
            echo "--- Poništavanje lokalnih izmena i povlačenje najnovijeg koda ---"
            git fetch origin main
            git reset --hard origin/main
            
            echo "--- Instalacija Composer zavisnosti ---"
            composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "--- Instalacija i build NPM asseta (Vite) ---"
            npm ci || npm install
            npm run build
            
            # Šema baze nije u migracijama: sql/ fajlovi se primenjuju ručno, redom iz sql/redosled.txt.
            # (database/migrations su stock Laravel tabele i ne pokreću se nad MariaDB-om.)
            
            echo "--- Čišćenje i optimizacija Laravel keša ---"
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear
            
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Artisan iznad radi kao SSH korisnik (root): fajlovi koje napravi (npr. dnevni log) moraju da budu
            # upisivi za PHP-FPM (www-data), inače sajt ne može da piše u log.
            chown -R www-data:www-data storage bootstrap/cache

            sudo systemctl reload php8.4-fpm

      - name: Send Success Email via Brevo SMTP
        if: success()
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [SUCCESS] Deploy uspešno završen - brokerporez.net"
          body: "Automatski deployment na main grani je uspešno izvršen na serveru. Vite asseti su kompajlirani i aplikacija je osvežena."
          to: "makimitrovic07@gmail.com"
          from: "BrokerPorez CI/CD <no-reply@brokerporez.net>"

      - name: Send Failure Email via Brevo SMTP
        if: failure()
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [FAILURE] Greška pri deploy-u - brokerporez.net"
          body: "Pažnja! Došlo je do greške tokom automatskog deployment-a na main grani. Proverite GitHub Actions logove."
          to: "makimitrovic07@gmail.com"
          from: "BrokerPorez CI/CD <no-reply@brokerporez.net>"