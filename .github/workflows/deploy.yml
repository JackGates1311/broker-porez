name: Production CI/CD Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          tools: composer

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/broker_porez
            
            echo "--- Povlačenje najnovijeg koda sa Git-a ---"
            git pull origin main
            
            echo "--- Instalacija zavisnosti ---"
            composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "--- Pokretanje migracija baze ---"
            php artisan migrate --force
            
            echo "--- Laravel optimizacija i keširanje ---"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "--- Napomena: .env i .sql skripte su ostavljene netaknute (ručno podešene na serveru) ---"

      - name: Send Success Email via Brevo SMTP
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }} # Možeš hardkodovati Brevo user ili staviti u Secrets
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [SUCCESS] Deploy uspešno završen - brokerporez.net"
          body: "Automatski deployment na main grani je uspešno izvršen na serveru. Aplikacija je osvežena i spremna."
          to: "makimitrovic07@gmail.com" # Gde želiš da primiš obaveštenje
          from: "BrokerPorez CI/CD <no-reply@brokerporez.net>"

      - name: Send Failure Email via Brevo SMTP
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [FAILURE] Greška pri deploy-u - brokerporez.net"
          body: "Pažnja! Došlo je do greške tokom automatskog deployment-a na main grani. Proverite GitHub Actions logove."
          to: "makimitrovic07@gmail.com"
          from: "BrokerPorez CI/CD <no-reply@brokerporez.net>"