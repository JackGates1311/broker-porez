name: Production CI/CD Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          tools: composer

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/broker_porez
            
            echo "--- Poništavanje lokalnih izmena i povlačenje najnovijeg koda ---"
            git fetch origin main
            git reset --hard origin/main
            
            echo "--- Instalacija Composer zavisnosti ---"
            composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "--- Instalacija i build NPM asseta (Vite) ---"
            npm ci || npm install
            npm run build
            
            echo "--- Pokretanje migracija baze ---"
            php artisan migrate --force
            
            echo "--- Čišćenje i optimizacija Laravel keša ---"
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear
            
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            sudo systemctl reload php8.4-fpm

      - name: Send Success Email via Brevo SMTP
        if: success()
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [SUCCESS] Deploy uspešno završen - brokerporez.net"
          body: "Automatski deployment na main grani je uspešno izvršen na serveru. Vite asseti su kompajlirani i aplikacija je osvežena."
          to: "makimitrovic07@gmail.com"
          from: "BrokerPorez CI/CD <no-reply@brokerporez.net>"

      - name: Send Failure Email via Brevo SMTP
        if: failure()
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [FAILURE] Greška pri deploy-u - brokerporez.net"
          body: "Pažnja! Došlo je do greške tokom automatskog deployment-a na main grani. Proverite GitHub Actions logove."
          to: "makimitrovic07@gmail.com"
          from: "BrokerPorez CI/CD <no-reply@brokerporez.net>"